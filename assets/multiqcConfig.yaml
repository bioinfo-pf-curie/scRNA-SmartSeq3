#
# RNA-seq config for MultiQC
#
#################################################################

skip_generalstats: true
skip_versions_section: true
disable_version_detection: true
read_count_multiplier: 0.001
read_count_prefix: 'K'
read_count_desc: 'thousands'

###################################
## Custom content

custom_data:
    my_stats:
        file_format: 'csv'
        section_name: 'General Metrics'
        description: ' of sequenced data'
        plot_type: 'table'
        pconfig:
            namespace: 'stats'
            id: 'stats'
            title: 'General Statistics'
            save_file: true
            col1_header: 'Sample ID'
        headers:
            Sample_name:
              title: 'Sample Name'
              scale: false
              format: '{:.0f}'
              placement: 2000
            Number_of_reads:
              title: 'Total Reads'
              scale: 'YlGnBu'
              format: '{:,.0f}'
              placement: 4000
            Number_of_rRNA:
              title: 'rRNA'
              scale: 'RdYlGn-rev'
              format: '{:,.0f}'
              hidden: true
              placement: 5000
            Percent_of_rRNA:
              title: 'rRNA (%)'
              min: 0
              max: 100
              scale: 'RdYlGn-rev'
              suffix: '%'
              format: '{:,.1f}'
              placement: 6000
            Strandness:
              scale: false
              placement: 3000
            Number_of_aligned_reads:
              title: 'Aligned Reads'
              scale: 'RdYlGn'
              format: '{:,0f}'
              hidden: true
              placement: 7000
            Percent_of_aligned_reads:
              title: 'Aligned Reads (%)'
              min: 0
              max: 100
              scale: 'RdYlGn'
              suffix: '%'
              format: '{:,.1f}'
              placement: 8000
            Number_of_uniquely_aligned_reads:
              title: 'Unique Reads'
              scale: 'RdYlGn'
              format: '{:,.0f}'
              hidden: true
              placement: 9000
            Percent_uniquely_aligned_reads:
              title: 'Unique Reads (%)'
              min: 0
              max: 100
              scale: 'RdYlGn'
              suffix: '%'
              format: '{:,.1f}'
              placement: 10000
            Number_of_multiple_aligned_reads:
              title: 'Multiple Reads'
              scale: 'RdYlGn-rev'
              format: '{:,0f}'
              hidden: true
              placement: 11000
            Percent_multiple_aligned:
              title: 'Multiple Reads (%)'
              min: 0
              max: 100
              scale: 'RdYlGn-rev'
              suffix: '%'
              format: '{:,.1f}'
              placement: 12000
            Number_of_duplicates:
              title: 'Duplicates'
              scale: 'RdYlGn-rev'
              format: '{:,0f}'
              hidden: true
              placement: 13000
            Percent_duplicates:
              title: 'Duplicates (%)'
              min: 0
              max: 100
              scale: 'RdYlGn-rev'
              suffix: '%'
              format: '{:,.1f}'
              placement: 14000

sp:
   my_stats:
      fn: '*.stats'

###############################
## Modules 

module_order:
  - fastqc
  - cutadapt
  - star
  - featureCounts
  - rseqc
  - qualimap
  - preseq:
     name: 'Sequencing Complexity'
     info: 'estimates the complexity of a library, showing how many additional unique reads are sequenced for increasing total read count. A shallow curve indicates complexity saturation. The dashed line shows a perfectly complex library where total reads = unique reads. The presented graph shows extrapolated curves up to 200M sequencing reads.'

#############################
## Removed plots
remove_sections :
  - fastqc_overrepresented_sequences
  - fastqc_per_base_n_content
  - fastqc_adapter_content
  - fastqc_per_sequence_quality_scores
  - fastqc_per_sequence_gc_content
  - fastqc_sequence_length_distribution
  - fastqc_sequence_counts
  - fastqc_status_checks

#############################
## Display

report_section_order:
  stats:
    order: 1
  gene_saturation:
    order: -400
  gene_type:
    order: -500
  DupRadar:
    order: -600 
  sample-pca:
    order: -800
  sample-correlation:
    order: -900
  software_versions:
    order: -1000
  summary:
    order: -1100

plots_force_interactive: True
