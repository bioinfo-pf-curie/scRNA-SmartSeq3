#
# RNA-seq config for MultiQC
#
#################################################################

skip_generalstats: true
skip_versions_section: true
disable_version_detection: true
#read_count_multiplier: 0.001
#read_count_prefix: 'K'
#read_count_desc: 'thousands'

###################################
## Custom content

custom_data:
    my_stats:
        file_format: 'csv'
        section_name: 'General Metrics'
        description: ' of sequenced data'
        plot_type: 'table'
        pconfig:
            namespace: 'stats'
            id: 'stats'
            title: 'General Statistics'
            save_file: true
            col1_header: 'Sample ID'
        headers:
            Sample_name:
              title: 'Sample Name'
              scale: false
              placement: 1000
            Number_of_frag:
              title: 'Total Fragments'
              scale: 'YlGn'
              format: '{:,.0f}'
              placement: 2000
              hidden: true
            Number_of_reads:
              title: 'Total Reads'
              scale: 'YlGn'
              format: '{:,.0f}'
              placement: 2500
              hidden: false
            Number_barcoded_reads:
              title: 'Barcoded Reads'
              scale: 'YlGn'
              format: '{:,.0f}'
              placement: 3000
              hidden: true
            Percent_barcoded:
              title: 'Barcoded (%)'
              format: '{:,.0f}'
              min: 0
              max: 100
              suffix: '%'
              scale: 'YlGnBu'
              placement: 3500
            Number_of_cells:
              title: 'Cells'
              scale: 'YlGn'
              format: '{:,.0f}'
              placement: 3800
              hidden: false

              
    mt_percent: 
      file_format: 'csv'
      section_name: 'Cell viability'
      title: '% Mitochondrial RNAs per cell'
      description: 'Percentage of mitochondrial RNAs is a cell viability marker. It varies according to your cell type (e.g cell line, primary cells, etc.). Here, only UMI reads are take into account.'
      plot_type: 'scatter'
      pconfig:
        id: 'mt'
        title: 'Percentage of mitochondrial RNAs per cell'
        xlab: 'Number of genes'
        ylab: '% mitochondrial RNAs'


sp:
   my_stats:
      fn: 'general_stats.mqc'
   mt_percent:
      fn: 'percent_mt.txt'

###############################
## Modules 

module_order:
  - fastqc
  - cutadapt
  - star
  - featureCounts
  - umitools
  - rseqc
  - qualimap

#############################
## Removed plots
remove_sections :
  - fastqc_overrepresented_sequences
  - fastqc_per_base_n_content
  - fastqc_adapter_content
  - fastqc_per_sequence_quality_scores
  - fastqc_per_sequence_gc_content
  - fastqc_sequence_length_distribution
  - fastqc_sequence_counts
  - fastqc_status_checks

#############################
## Display

report_section_order:
  stats:
    order: 1
  mt_percent:
    order: -900
  software_versions:
    order: -1000
  summary:
    order: -1100

plots_force_interactive: True
