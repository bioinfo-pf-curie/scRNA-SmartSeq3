#
# RNA-seq config for MultiQC
#
#################################################################

skip_generalstats: true
skip_versions_section: true
disable_version_detection: true
#read_count_multiplier: 0.001
#read_count_prefix: 'K'
#read_count_desc: 'thousands'

###################################
## Custom content

custom_data:
    my_stats:
        file_format: 'csv'
        section_name: 'General Metrics'
        description: |
            Summary of single cell transcriptomics data.
            If a sample contains more than one cell, means across cells are reported.
            Reads are uniquely aligned, deduplicated (PCR duplicates are removed) and assigned to genes.
            Genes are detected using all reads or using only UMI reads.
        plot_type: 'table'
        pconfig:
            id: 'stats'
            save_file: true
        headers:
            Sample_id:
              title: 'Sample ID'
              scale: false
              placement: 900
            Sample_name:
              title: 'Sample Name'
              scale: false
              placement: 1000
            Total_cells:
              title: 'Total Cells'
              scale: 'Oranges'
              format: '{:,.0f}'
              placement: 2000
              hidden: false
            Number_of_frag:
              title: 'Total Fragments'
              scale: 'YlGn'
              format: '{:,.0f}'
              placement: 3000
              hidden: false
            Number_of_reads:
              title: 'Total Reads'
              scale: 'YlGn'
              format: '{:,.0f}'
              placement: 4000
              hidden: false
            Number_umis:
              title: 'Total UMIs'
              scale: 'PuBu'
              format: '{:,.0f}'
              placement: 5000
              hidden: false
            Percent_umis:
              title: '%UMIs'
              scale: 'PuBu'
              min: 0
              max: 100
              suffix: '%'
              format: '{:,.0f}'
              placement: 6000
              hidden: false
            Percent_aligned:
              title: '%Aligned'
              scale: 'YlOrBr'
              min: 0
              max: 100
              suffix: '%'
              format: '{:,.0f}'
              placement: 7000
              hidden: false
            Number_aligned:
              title: 'Aligned'
              scale: 'YlOrBr'
              format: '{:,.0f}'
              placement: 8000
              hidden: true
            Percent_dedup:
              title: '%Deduplicated'
              scale: 'BuPu'
              min: 0
              max: 100
              suffix: '%'
              format: '{:,.0f}'
              placement: 9000
              hidden: false
            Number_dedup:
              title: 'Deduplicated'
              scale: 'BuPu'
              format: '{:,.0f}'
              placement: 9500
              hidden: true
            Percent_assigned:
              title: '%Assigned'
              scale: 'OrRd'
              min: 0
              max: 100
              suffix: '%'
              format: '{:,.0f}'
              placement: 10000
              hidden: false
            Cells:
              title: 'Cells'
              scale: 'Oranges'
              format: '{:,.0f}'
              placement: 11000
              hidden: false
            Final_reads:
              title: 'Reads'
              scale: 'PuRd'
              format: '{:,.0f}'
              placement: 11500
              hidden: false
            Mean_genes_reads:
              title: 'Genes (reads)'
              scale: 'Greys'
              format: '{:,.0f}'
              placement: 12000
              hidden: false
            Final_umis:
              title: 'UMIs'
              scale: 'Greens'
              format: '{:,.0f}'
              placement: 13000
              hidden: false
            Mean_genes_umis:
              title: 'Genes (UMIs)'
              scale: 'YlGnBu'
              format: '{:,.0f}'
              placement: 14000
              hidden: false
              
    mt_percent: 
      file_format: 'csv'
      section_name: 'Cell viability'
      title: '% Mitochondrial RNAs per cell'
      description: 'Percentage of mitochondrial RNAs is a cell viability marker. It varies according to your cell type (e.g cell line, primary cells, etc.).'
      plot_type: 'scatter'
      pconfig:
        id: 'mt'
        title: 'Percentage of mitochondrial RNAs per cell'
        xlab: 'Number of genes'
        ylab: '% mitochondrial RNAs'

    sat_curve: 
      file_format: 'csv'
      section_name: 'Saturation Plot'
      description: 'Scatter plot helping to assess whether the sequencing depth is sufficient to capture the transcriptome complexity. A curve approaching a plateau suggests saturation.'
      plot_type: 'scatter'
      pconfig:
        title: 'Raw reads vs Genes per cell'
        id: 'sat'
        ylab: 'Genes'
        xlab: 'Total reads'

sp:
   my_stats:
      fn: 'general_stats.mqc'
   mt_percent:
      fn: 'percent_mt.txt'
   sat_curve:
      fn: 'satCurve.txt'

###############################
## Modules 

module_order:
  - fastqc
  - cutadapt
  - star
  - featurecounts
  - umitools
  - rseqc
  - qualimap

#############################
## Removed plots
remove_sections :
  - star_summary
  - umitools-umi-stats
  - fastqc_overrepresented_sequences
  - fastqc_per_base_n_content
  - fastqc_adapter_content
  - fastqc_per_sequence_quality_scores
  - fastqc_per_sequence_gc_content
  - fastqc_sequence_length_distribution
  - fastqc_sequence_counts
  - fastqc_status_checks

#############################
## Display

report_section_order:
  stats:
    order: 1
  mt_percent:
    order: -800
  sat_curve:
    order: -900
  software_versions:
    order: -1000
  summary:
    order: -1100

plots_force_interactive: True
